# ============================================================================
# OrangeFox R12.0 · Samsung Galaxy Note10 5G (d1x / SM-N971N) · fox_16.0
#
# 必须用 self-hosted runner：本机 11.9 GB 内存 / 单次构建 ~33-50 分钟，
# 云端 runner 的磁盘（~65 GB）装不下 AOSP 16 的 repo sync（>100 GB）。
#
# 构建流程（按本机实测通过的方式）：
#   1. mka adbd recoveryimage        —— 让 AOSP 生成 ramdisk-recovery.img
#      ※ 这一步**预期会因尺寸检查失败**：构建系统固定用 `lzma -6` 压缩 ramdisk
#        （~18.45 MB），加上 49.46 MB 的 prebuilt/Image 会超出 67,563,520 B 上限。
#        但 ramdisk 产物在失败前就已经生成，所以下面继续。
#   2. tools/make_recovery_image.sh  —— 官方流程：lzma -9 重压 ramdisk、
#      自己调 mkbootimg 把 boot 头部 os_version 写成 17（A17 ROM 解密必需）、
#      再用 avbtool 重新做 AVB 签名，最后校验尺寸/头部/哈希/Avb 尾部。
#   3. 上传 dist/（recovery.img + Odin tar + 校验和），可选发 Release。
# ============================================================================

name: OrangeFox d1x build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 Releases'
        type: boolean
        default: false
      sync_first:
        description: '构建前先 repo sync'
        type: boolean
        default: false
      fox_dir:
        description: '源码树路径（留空自动探测 ~/fox、/home/lenovo/fox）'
        type: string
        default: ''
      jobs:
        description: '并行数'
        type: string
        default: '4'
      release_tag:
        description: '发布 tag（留空自动生成）'
        type: string
        default: ''
  push:
    branches: [fox_16.0]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: write

env:
  RECOVERY_PARTITION: 67633152
  LUNCH_TARGET: twrp_d1x-bp2a-eng
  TARGET_PRODUCT: twrp_d1x
  TARGET_RELEASE: bp2a
  TARGET_BUILD_VARIANT: eng

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 900

    steps:
      - name: 环境信息
        run: |
          set -eu
          {
            echo '### Runner'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| 主机 | $(uname -srm) |"
            echo "| 内存 | $(free -g | awk '/Mem:/{print $2\" GB\"}') |"
            echo "| 磁盘 | $(df -h "$PWD" | tail -1 | tr -s ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 定位源码树
        run: |
          set -eu
          IN="${{ inputs.fox_dir }}"
          if [ -n "$IN" ]; then CAND="$IN"; else CAND="${HOME}/fox /home/lenovo/fox ${GITHUB_WORKSPACE}"; fi
          FOX=""
          for c in $CAND; do [ -d "$c/.repo" ] && { FOX="$c"; break; }; done
          [ -n "$FOX" ] || { echo "::error::找不到已 repo sync 的源码树（需要 .repo 目录）"; exit 1; }
          echo "FOX=$FOX" >> "$GITHUB_ENV"
          echo "源码树：$FOX"

      - name: 预检（版本快照 + 关键文件）
        run: |
          set -eu
          FOX="$FOX"
          {
            echo '### 版本快照'
            echo ''
            echo '| 仓库 | 分支 | commit |'
            echo '| --- | --- | --- |'
            for r in d1x exynos9820-common; do
              d="$FOX/device/samsung/$r"
              b=$(git -C "$d" branch --show-current 2>/dev/null || echo '?')
              c=$(git -C "$d" log -1 --format='%h %s' 2>/dev/null || echo '?')
              echo "| $r | $b | $c |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          miss=0
          for f in \
            device/samsung/d1x/AndroidProducts.mk \
            device/samsung/d1x/BoardConfig.mk \
            device/samsung/d1x/twrp_d1x.mk \
            device/samsung/d1x/vendorsetup.sh \
            device/samsung/d1x/prebuilt/Image \
            device/samsung/d1x/prebuilt/dtbo.img \
            device/samsung/d1x/tools/make_recovery_image.sh \
            device/samsung/exynos9820-common/BoardConfigCommon.mk \
            device/samsung/exynos9820-common/device-common.mk \
            device/samsung/exynos9820-common/recovery.fstab \
            device/samsung/exynos9820-common/recovery/root/system/bin/prepdecrypt.sh \
            device/samsung/exynos9820-common/recovery/root/system/etc/init/exynos9820-common.rc ; do
            [ -f "$FOX/$f" ] || { echo "::error::缺少 $f"; miss=1; }
          done
          [ "$miss" -eq 0 ] || exit 1

          # 关键配置必须在位，否则构建出来的镜像要么进不去要么解不了密
          grep -q -- '--os_version 17' "$FOX/device/samsung/exynos9820-common/BoardConfigCommon.mk" \
            || { echo "::error::BoardConfigCommon.mk 缺少 --os_version 17（解密必需）"; exit 1; }
          grep -q 'max_brightness 100' \
            "$FOX/device/samsung/exynos9820-common/recovery/root/system/etc/init/exynos9820-common.rc" \
            || { echo "::error::exynos9820-common.rc 缺少 max_brightness 100（手电筒必需）"; exit 1; }
          echo "Image: $(stat -c%s "$FOX/device/samsung/d1x/prebuilt/Image") 字节"
          echo "dtbo : $(stat -c%s "$FOX/device/samsung/d1x/prebuilt/dtbo.img") 字节"

      - name: repo sync（可选）
        if: ${{ inputs.sync_first }}
        run: |
          set -eu
          cd "$FOX"
          repo sync -c -j"${{ inputs.jobs }}" --force-sync --no-clone-bundle --no-tags

      - name: 构建 ramdisk
        run: |
          set -eu
          cd "$FOX"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=d1x
          export LC_ALL=C
          set +u
          source build/envsetup.sh
          set -u
          lunch "$LUNCH_TARGET"
          # lunch 之后再显式导出一次：否则 release_config 找不到 bp2a 会 panic
          export TARGET_PRODUCT=twrp_d1x TARGET_RELEASE=bp2a TARGET_BUILD_VARIANT=eng

          set +e
          mka adbd recoveryimage -j"${{ inputs.jobs }}" 2>&1 | tee /tmp/d1x-build.log
          RC=${PIPESTATUS[0]}
          set -e

          OUT="$FOX/out/target/product/d1x"
          if [ -f "$OUT/ramdisk-recovery.img" ]; then
            echo "ramdisk 已生成（mka 退出码 $RC；尺寸检查失败属预期）"
          else
            echo "::error::ramdisk-recovery.img 没有生成，mka 退出码 $RC"
            tail -n 60 /tmp/d1x-build.log
            exit 1
          fi

      - name: 打包 + 签名 + 校验
        run: |
          set -eu
          "$FOX/device/samsung/d1x/tools/make_recovery_image.sh" "$FOX" 2>&1 | tee /tmp/d1x-package.log
          OUT="$FOX/out/target/product/d1x"
          {
            echo '### 产物'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| recovery.img | $(stat -c%s "$OUT/dist/recovery.img") 字节 |"
            echo "| 分区上限 | $RECOVERY_PARTITION |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$OUT/dist/recovery.img.sha256")\` |"
            echo "| tar md5 | \`$(cut -d' ' -f1 "$OUT/dist/recovery.tar.md5")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.0-d1x
          path: out/target/product/d1x/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（可选）
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          OUT="$FOX/out/target/product/d1x/dist"
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="ofox-d1x-$(date -u +%Y%m%d-%H%M)"
          {
            echo "# OrangeFox R12.0 · d1x · $TAG"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| recovery.img | $(stat -c%s "$OUT/recovery.img") 字节 |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$OUT/recovery.img.sha256")\` |"
            echo "| 内核 | 4.14.357-openela-ga0e2ad468dd5（crDroid 官方，实测可用） |"
            echo "| boot os_version | 17 / 2026-10-01 |"
            echo ""
            echo "## 刷入（三星）"
            echo '```'
            echo "Odin → Options 取消勾选 Auto Reboot → AP 选 recovery.tar → Start"
            echo "PASS 后立刻按住 音量+ + 电源 + Bixby，看到 OrangeFox 图标就松开电源键"
            echo '```'
          } > "$OUT/NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT/recovery.tar" "$OUT/recovery.img" "$OUT/recovery.img.sha256" "$OUT/recovery.tar.md5" --clobber
            gh release edit "$TAG" --notes-file "$OUT/NOTES.md"
          else
            gh release create "$TAG" "$OUT/recovery.tar" "$OUT/recovery.img" "$OUT/recovery.img.sha256" "$OUT/recovery.tar.md5" \
              --target "${{ github.ref_name }}" \
              --title "OrangeFox R12.0 d1x $TAG" --notes-file "$OUT/NOTES.md"
          fi
