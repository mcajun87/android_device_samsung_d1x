# 汇总发布：把内核 Image 与 recovery.img 装进同一个 Release
# 放到 mcajun87/android_device_samsung_d1x（默认分支）的
# .github/workflows/publish-bundle.yml
#
# 发布开关：Run workflow 面板里的「创建合并 Release」勾选框（type: boolean）
#   不勾 = 只下载 + 校验 + 上传 Artifact（可以先用它核对两边的字节数）
#   勾上 = 再把合成包发成一个 Release
# 它不编译任何东西，只取现成 Release 里的资产。

name: Publish bundle

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '创建合并 Release'
        type: boolean
        default: false
      image_tag:
        description: '内核仓 Release tag（留空取最新）'
        type: string
        default: ''
      recovery_tag:
        description: '设备仓 Release tag（留空取最新）'
        type: string
        default: ''
      bundle_tag:
        description: '合并 Release tag（留空自动生成 ofox-bundle-日期-时间）'
        type: string
        default: ''

permissions:
  contents: write

env:
  KERNEL_REPO: mcajun87/Rocky7842_android_kernel_samsung_exynos9820
  DEVICE_REPO: mcajun87/android_device_samsung_d1x
  RECOVERY_PARTITION: 67633152
  DTBO_BYTES: 974848
  BOOT_HEADER_BYTES: 2048

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IT="${{ inputs.image_tag }}"
          RT="${{ inputs.recovery_tag }}"
          BT="${{ inputs.bundle_tag }}"
          if [ -z "$IT" ]; then
            IT=$(gh release list -R "$KERNEL_REPO" -L 1 --json tagName -q '.[0].tagName')
          fi
          if [ -z "$RT" ]; then
            RT=$(gh release list -R "$DEVICE_REPO" -L 1 --json tagName -q '.[0].tagName')
          fi
          [ -n "$BT" ] || BT="ofox-bundle-$(date -u +%Y%m%d-%H%M)"
          echo "IMAGE_TAG=$IT"    >> "$GITHUB_ENV"
          echo "RECOVERY_TAG=$RT" >> "$GITHUB_ENV"
          echo "BUNDLE_TAG=$BT"   >> "$GITHUB_ENV"
          {
            echo "### 开关状态"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 创建合并 Release | ${{ inputs.publish }} |"
            echo "| Image tag | $IT |"
            echo "| recovery tag | $RT |"
            echo "| 合并 tag | $BT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p bundle/image bundle/recovery
          gh release download "$IMAGE_TAG" -R "$KERNEL_REPO" -D bundle/image --clobber
          gh release download "$RECOVERY_TAG" -R "$DEVICE_REPO" -D bundle/recovery --clobber
          ls -l bundle/image bundle/recovery

      - name: Verify + notes
        run: |
          set -eu
          IMG=$(find bundle/image -maxdepth 1 -name 'Image*' | head -1 || true)
          REC=bundle/recovery/recovery.img
          test -f "$REC" || { echo "::error::没有 recovery.img"; exit 1; }
          RB=$(stat -c%s "$REC")
          {
            echo "# d1x 合并包 · $BUNDLE_TAG"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            if [ -n "$IMG" ]; then
              IB=$(stat -c%s "$IMG")
              echo "| 内核 Image 字节 | $IB |"
              echo "| 给 ramdisk 的额度 | $(( RECOVERY_PARTITION - IB - DTBO_BYTES - BOOT_HEADER_BYTES )) |"
            else
              echo "| 内核 Image | 未提供 |"
            fi
            echo "| recovery.img 字节 | $RB |"
            echo "| 分区上限 | $RECOVERY_PARTITION |"
            echo "| recovery 余量 | $(( RECOVERY_PARTITION - RB )) |"
            echo "| Image 来源 tag | $IMAGE_TAG |"
            echo "| recovery 来源 tag | $RECOVERY_TAG |"
            echo ""
            echo "## 刷入"
            echo ""
            echo '```'
            echo "fastboot flash recovery recovery.img"
            echo '```'
          } > bundle/NOTES.md
          cat bundle/NOTES.md >> "$GITHUB_STEP_SUMMARY"
          ( cd bundle && find . -maxdepth 2 -type f ! -name NOTES.md -exec sha256sum {} \; > SHA256SUMS.txt )
          cat bundle/SHA256SUMS.txt

      - name: Sanity check recovery size
        run: |
          set -eu
          RB=$(stat -c%s bundle/recovery/recovery.img)
          if [ "$RB" -gt "$RECOVERY_PARTITION" ]; then
            echo "::error::recovery.img $RB 超过分区 $RECOVERY_PARTITION，不能发布"
            exit 1
          fi
          echo "recovery.img $RB ≤ $RECOVERY_PARTITION，通过"

      - name: Upload artifact（不发也留一份）
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ env.BUNDLE_TAG }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Create bundle release（开关打开才跑）
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          FILES=$(find bundle -maxdepth 2 -type f ! -name NOTES.md | tr '\n' ' ')
          if gh release view "$BUNDLE_TAG" >/dev/null 2>&1; then
            gh release upload "$BUNDLE_TAG" $FILES bundle/SHA256SUMS.txt --clobber
            gh release edit "$BUNDLE_TAG" --notes-file bundle/NOTES.md
          else
            gh release create "$BUNDLE_TAG" $FILES bundle/SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title "d1x 合并包 $BUNDLE_TAG" \
              --notes-file bundle/NOTES.md
          fi
          echo "发布地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/$BUNDLE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped publishing
        if: ${{ !inputs.publish }}
        run: echo "发布开关关闭，只汇总校验，产物在上面的 Artifact 里。" >> "$GITHUB_STEP_SUMMARY"
