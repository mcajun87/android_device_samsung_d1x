name: Build OrangeFox 16.0 (d1x)
run-name: Build d1x by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release？'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-17-jdk repo ccache

      - name: Init and Sync Repo
        run: |
          mkdir -p ~/fox
          cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

      - name: Clone Device Trees
        run: |
          cd ~/fox
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          git clone -b fox_16.0 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common
          
          find device/ -maxdepth 1 -mindepth 1 -type d -not -name "samsung" -exec rm -rf {} + || true
          find device/samsung -maxdepth 1 -mindepth 1 -type d -not -name "d1x" -not -name "exynos9820-common" -exec rm -rf {} + || true

      - name: Force Generate Makefiles
        run: |
          cd ~/fox
          
          # 核心修复 1：必须包含 COMMON_LUNCH_CHOICES
          cat << 'EOF' > device/samsung/d1x/AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_d1x.mk

          COMMON_LUNCH_CHOICES := \
              twrp_d1x-eng
          EOF
          
          # 核心修复 2：在设备 mk 文件里注入 TARGET_RELEASE
          cat << 'EOF' > device/samsung/d1x/twrp_d1x.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)
          $(call inherit-product, device/samsung/d1x/device.mk)

          PRODUCT_DEVICE := d1x
          PRODUCT_NAME := twrp_d1x
          PRODUCT_BRAND := samsung
          PRODUCT_MODEL := SM-N971N
          PRODUCT_MANUFACTURER := samsung

          TARGET_RELEASE := trunk_staging
          EOF
          
          sed -i '/add_lunch_combo/d' device/samsung/d1x/vendorsetup.sh
          
          echo "=== 检查 AndroidProducts.mk ==="
          cat device/samsung/d1x/AndroidProducts.mk

      - name: Build Recovery
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          source build/envsetup.sh
          
          echo "=== 执行 lunch ==="
          lunch twrp_d1x-eng
          
          echo "=== 开始编译 Recovery ==="
          mka recoveryimage -j$(nproc)

      - name: Package to Odin Tar
        run: |
          cd ~/fox/out/target/product/d1x
          if [ -f recovery.img ]; then
            echo "编译成功，正在打包 Odin Tar..."
            tar -cf recovery.tar recovery.img
            md5sum recovery.tar > recovery.tar.md5
          else
            echo "未找到 recovery.img，编译失败。"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-d1x-Recovery
          path: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
          if-no-files-found: error

      - name: Publish Release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OrangeFox-d1x-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          files: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}