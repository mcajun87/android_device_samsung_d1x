name: BuildRecoveryTest
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl python3 python-is-python3 openjdk-17-jdk repo ccache
          
      - name: Sync Source
        run: |
          mkdir -p ~/fox && cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          repo sync -c -j4 --no-clone-bundle --no-tags
          
      - name: Add Device Tree
        run: |
          cd ~/fox
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          git clone -b fox_16.0 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common
          
      - name: Fix Lunch Target
        run: |
          cd ~/fox
          
          # 1. 强制重写 AndroidProducts.mk，注册正确的三段式目标
          cat << 'EOF' > device/samsung/d1x/AndroidProducts.mk
PRODUCT_MAKEFILES := \
    $(LOCAL_DIR)/twrp_d1x.mk

COMMON_LUNCH_CHOICES := \
    twrp_d1x-trunk_staging-eng
EOF
          
          # 2. 核心修复：把 TARGET_RELEASE 直接写进 BoardConfig.mk，告诉底层编译器用这个配置
          echo "TARGET_RELEASE := trunk_staging" >> device/samsung/d1x/BoardConfig.mk
          
          # 删除报错的废弃指令
          sed -i '/add_lunch_combo/d' device/samsung/d1x/vendorsetup.sh
          
          echo "=== 检查 AndroidProducts.mk ==="
          cat device/samsung/d1x/AndroidProducts.mk
          
      - name: Compile
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          source build/envsetup.sh
          
          echo "=== 执行 lunch ==="
          lunch twrp_d1x-trunk_staging-eng
          
          echo "=== 开始编译 ==="
          mka recoveryimage -j$(nproc)