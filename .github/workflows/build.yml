name: Build OrangeFox 16.0 (d1x)
run-name: Build d1x by ${{ github.actor }}

on:
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 超时时间设为 6 小时

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space (腾出最大可用空间)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies (安装编译依赖)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-17-jdk repo ccache

      - name: Set up ccache (开启编译缓存)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Init and Sync Repo (同步 OrangeFox 源码)
        run: |
          mkdir -p ~/fox
          cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          # -c 只拉取当前分支，--no-tags 不要标签，尽可能省空间
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

      - name: Clone Device Trees (拉取并清理设备树)
        run: |
          cd ~/fox
          mkdir -p device/samsung
          # 拉取 d1x 设备树 (使用当前触发工作流的 commit)
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          # 拉取公共树
          git clone -b fox_16.0 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common
          
          # ================= 核心修复 =================
          # 暴力清理所有非 samsung 的厂牌目录（干掉小米等干扰）
          find device/ -maxdepth 1 -mindepth 1 -type d -not -name "samsung" -exec rm -rf {} + || true
          # 确保 samsung 目录下只有 d1x 和公共树
          find device/samsung -maxdepth 1 -mindepth 1 -type d -not -name "d1x" -not -name "exynos9820-common" -exec rm -rf {} + || true
          # ============================================

      - name: Build Recovery (开始编译)
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          # 确保环境加载时只识别到我们的 d1x 设备
          source build/envsetup.sh
          
          # 直接执行 lunch twrp_d1x-eng
          echo "=== 尝试执行 lunch twrp_d1x-eng ==="
          lunch twrp_d1x-eng
          
          # 开始编译
          mka recoveryimage -j$(nproc)

      - name: Package to Odin Tar (打包成 Odin 刷机包)
        run: |
          cd ~/fox/out/target/product/d1x
          # 检查 recovery.img 是否生成
          if [ -f recovery.img ]; then
            echo "编译成功，正在打包为 Odin tar..."
            tar -cf recovery.tar recovery.img
            md5sum recovery.tar > recovery.tar.md5
          else
            echo "未找到 recovery.img，编译可能失败。"
            exit 1
          fi

      - name: Upload Artifact (上传产物)
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-d1x-Recovery
          path: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
          if-no-files-found: error