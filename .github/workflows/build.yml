name: Build OrangeFox 16.0 (d1x) - Safe Slim
run-name: Build d1x by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release？'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Swap (防止内存爆满被强杀)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-17-jdk repo ccache lz4 lzma

      - name: Init and Sync Repo (Max Retry)
        run: |
          mkdir -p ~/fox
          cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          
          for i in {1..3}; do
            echo "=== 尝试同步源码 (第 $i 次) ==="
            repo sync -c -j4 --no-clone-bundle --no-tags --force-sync && break
            echo "=== 同步失败，等待 10 秒后重试 ==="
            sleep 10
          done
          
          if [ ! -f "build/envsetup.sh" ]; then
             repo sync -c -j1 --no-clone-bundle --no-tags --force-sync || true
          fi
          
          if [ ! -f "build/envsetup.sh" ]; then
            exit 1
          fi

      - name: Clone Device Trees & Remove FoxCLI
        run: |
          cd ~/fox
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          git clone -b fox_16.0 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common
          
          find device/ -maxdepth 1 -mindepth 1 -type d -not -name "samsung" -exec rm -rf {} + || true
          find device/samsung -maxdepth 1 -mindepth 1 -type d -not -name "d1x" -not -name "exynos9820-common" -exec rm -rf {} + || true
          
          # 移除引发编译中断的 foxcli
          rm -rf external/foxcli
          sed -i '/foxcli/d' vendor/twrp/config/common.mk || true
          sed -i '/foxcli/d' vendor/twrp/config/packages.mk || true

      - name: Force Fix Makefiles & Extreme Slim
        run: |
          cd ~/fox
          
          echo 'PRODUCT_MAKEFILES := \' > device/samsung/d1x/AndroidProducts.mk
          echo '    $(LOCAL_DIR)/twrp_d1x.mk' >> device/samsung/d1x/AndroidProducts.mk
          echo '' >> device/samsung/d1x/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := \' >> device/samsung/d1x/AndroidProducts.mk
          echo '    twrp_d1x-bp2a-eng' >> device/samsung/d1x/AndroidProducts.mk
          
          echo '$(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)' > device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, vendor/twrp/config/common.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, device/samsung/d1x/device.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_DEVICE := d1x' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_NAME := twrp_d1x' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_BRAND := samsung' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_MODEL := SM-N971N' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_MANUFACTURER := samsung' >> device/samsung/d1x/twrp_d1x.mk
          
          echo 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' >> device/samsung/d1x/twrp_d1x.mk
          echo 'BUILD_BROKEN_ELF_PREBUILT_PACKAGE_COPY := true' >> device/samsung/d1x/twrp_d1x.mk
          
          # 清理之前可能留下的错误配置
          sed -i '/TW_EXTRA_LANGUAGES/d' device/samsung/d1x/BoardConfig.mk
          sed -i '/TW_DEFAULT_LANGUAGE/d' device/samsung/d1x/BoardConfig.mk
          sed -i '/OF_USE_LZMA_COMPRESSION/d' device/samsung/d1x/BoardConfig.mk
          sed -i '/LZMA_RAMDISK_TARGETS/d' device/samsung/d1x/BoardConfig.mk
          sed -i '/BUILD_BROKEN_ELF_PREBUILT_PACKAGE_COPY/d' device/samsung/d1x/BoardConfig.mk
          
          # 正确的 LZMA 配置（绝不改底层 Makefile）
          echo 'TW_EXTRA_LANGUAGES := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_DEFAULT_LANGUAGE := zh_CN' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_LANGUAGES := en_US zh_CN zh_TW' >> device/samsung/d1x/BoardConfig.mk
          echo 'OF_USE_LZMA_COMPRESSION := 1' >> device/samsung/d1x/BoardConfig.mk
          echo 'LZMA_RAMDISK_TARGETS := recovery' >> device/samsung/d1x/BoardConfig.mk
          
          # 剔除所有不必要的大型组件
          echo 'TW_EXCLUDE_SUPERSU := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_EXCLUDE_TWRPAPP := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_EXCLUDE_NANO := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_EXCLUDE_BASH := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_EXCLUDE_PYTHON := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'TW_EXCLUDE_TZDATA := true' >> device/samsung/d1x/BoardConfig.mk
          echo 'OF_DISABLE_MIUI_SPECIFIC_FEATURES := 1' >> device/samsung/d1x/BoardConfig.mk
          
          # 终极物理清理：强制删掉 Recovery 根目录下的高分辨率无用图片（能腾出好几MB）
          echo 'BOARD_RECOVERY_IMAGE_PREPARE += rm -rf $(TARGET_RECOVERY_ROOT_OUT)/twres/images/xxhdpi/*; rm -rf $(TARGET_RECOVERY_ROOT_OUT)/twres/images/xhdpi/*;' >> device/samsung/d1x/BoardConfig.mk
          
          # 启动项变量瘦身
          echo 'export FOX_DRASTIC_SIZE_REDUCTION=1' >> device/samsung/d1x/vendorsetup.sh
          echo 'export FOX_DELETE_AROMAFM=1' >> device/samsung/d1x/vendorsetup.sh
          echo 'export FOX_REMOVE_AAPT=1' >> device/samsung/d1x/vendorsetup.sh
          
          sed -i '/add_lunch_combo/d' device/samsung/d1x/vendorsetup.sh
          
          sed -i 's/\r$//' device/samsung/d1x/AndroidProducts.mk
          sed -i 's/\r$//' device/samsung/d1x/twrp_d1x.mk
          sed -i 's/\r$//' device/samsung/d1x/vendorsetup.sh
          sed -i 's/\r$//' device/samsung/d1x/BoardConfig.mk

      - name: Build Recovery
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=d1x
          
          export BUILD_BROKEN_ELF_PREBUILT_PACKAGE_COPY=true
          export BUILD_BROKEN_DISABLE_16K_CHECK=true
          export DISABLE_16K_CHECK=true
          
          source build/envsetup.sh
          
          echo "=== 执行 lunch ==="
          lunch twrp_d1x-bp2a-eng
          
          echo "=== 开始编译 Recovery (官方 LZMA 极致瘦身) ==="
          mka recoveryimage -j2

      - name: Package to Odin Tar
        run: |
          cd ~/fox/out/target/product/d1x
          if [ -f recovery.img ]; then
            tar -cf recovery.tar recovery.img
            md5sum recovery.tar > recovery.tar.md5
          else
            echo "未找到 recovery.img，编译失败。"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-d1x-Recovery
          path: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5

      - name: Publish Release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OrangeFox-d1x-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          files: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}