name: Build OrangeFox 16.0 (d1x)
run-name: Build d1x by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release？'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-17-jdk repo ccache

      - name: Init and Sync Repo (Max Retry)
        run: |
          mkdir -p ~/fox
          cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 --depth=1
          
          for i in {1..3}; do
            echo "=== 尝试同步源码 (多线程, 第 $i 次) ==="
            repo sync -c -j4 --no-clone-bundle --no-tags --force-sync && break
            echo "=== 同步失败，等待 10 秒后重试 ==="
            sleep 10
          done
          
          if [ ! -f "build/envsetup.sh" ]; then
             echo "=== 多线程失败，切换为单线程龟速同步... ==="
             repo sync -c -j1 --no-clone-bundle --no-tags --force-sync || true
          fi
          
          if [ ! -f "build/envsetup.sh" ]; then
            echo "源码同步最终失败，请重新运行工作流"
            exit 1
          fi

      - name: Clone Device Trees
        run: |
          cd ~/fox
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          git clone -b fox_16.0 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common
          
          find device/ -maxdepth 1 -mindepth 1 -type d -not -name "samsung" -exec rm -rf {} + || true
          find device/samsung -maxdepth 1 -mindepth 1 -type d -not -name "d1x" -not -name "exynos9820-common" -exec rm -rf {} + || true

      - name: Force Fix Makefiles & Hack Soong Panic
        run: |
          cd ~/fox
          
          # 1. 强制注册带 trunk_staging 的三段式目标，解决 Invalid lunch combo
          echo 'PRODUCT_MAKEFILES := \' > device/samsung/d1x/AndroidProducts.mk
          echo '    $(LOCAL_DIR)/twrp_d1x.mk' >> device/samsung/d1x/AndroidProducts.mk
          echo '' >> device/samsung/d1x/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := \' >> device/samsung/d1x/AndroidProducts.mk
          echo '    twrp_d1x-trunk_staging-eng' >> device/samsung/d1x/AndroidProducts.mk
          
          # 2. 写死 TARGET_RELEASE 给编译器看
          echo "TARGET_RELEASE := trunk_staging" >> device/samsung/d1x/BoardConfig.mk
          
          # 3. 删掉废弃的指令
          sed -i '/add_lunch_combo/d' device/samsung/d1x/vendorsetup.sh
          
          # 4. 核武器：修改底层源码，把导致崩溃的 error 和 panic 强行屏蔽掉！
          # 把 Makefile 里的 error 改成 warning
          sed -i 's/\$(error release-config failed to run)/\$(warning release-config failed to run, ignoring...)/g' build/make/core/release_config.mk || true
          # 把 Go 源码里的 panic 注释掉
          sed -i 's/panic(/\/\/ panic(/g' build/soong/cmd/release_config/main.go || true
          
          echo "=== 检查底层代码是否修改成功 ==="
          grep -n "warning release-config" build/make/core/release_config.mk || true
          grep -n "// panic" build/soong/cmd/release_config/main.go || true

      - name: Build Recovery
        run: |
          cd ~/fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          source build/envsetup.sh
          
          echo "=== 执行 lunch ==="
          lunch twrp_d1x-trunk_staging-eng
          
          echo "=== 开始编译 Recovery ==="
          mka recoveryimage -j$(nproc)

      - name: Package to Odin Tar
        run: |
          cd ~/fox/out/target/product/d1x
          if [ -f recovery.img ]; then
            echo "编译成功，正在打包 Odin Tar..."
            tar -cf recovery.tar recovery.img
            md5sum recovery.tar > recovery.tar.md5
          else
            echo "未找到 recovery.img，编译失败。"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-d1x-Recovery
          path: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
          if-no-files-found: error

      - name: Publish Release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OrangeFox-d1x-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          files: |
            ~/fox/out/target/product/d1x/recovery.img
            ~/fox/out/target/product/d1x/recovery.tar
            ~/fox/out/target/product/d1x/recovery.tar.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}