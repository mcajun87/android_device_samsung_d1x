name: 构建 OrangeFox R12.1 (d1x)
run-name: Build R12.1 by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release？'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 openjdk-11-jdk ccache aria2 xmlstarlet repo

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-fox121-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-fox121-

      - name: Init and Sync Repo (官方 12.1 专用方式)
        run: |
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Clone Device Trees
        run: |
          cd ~/fox_12.1
          mkdir -p device/samsung
          # 复制你的设备树
          cp -r $GITHUB_WORKSPACE device/samsung/d1x
          # 拉取公共树 (强制使用 fox_12.1)
          git clone -b fox_12.1 --depth=1 https://github.com/mcajun87/android_device_samsung_exynos9820-common.git device/samsung/exynos9820-common

          # 🚨 保险措施：强制修复 12.1 的编译目标（防止你设备树里的名字不匹配）
          echo 'PRODUCT_MAKEFILES := \' > device/samsung/d1x/AndroidProducts.mk
          echo '    $(LOCAL_DIR)/twrp_d1x.mk' >> device/samsung/d1x/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := \' >> device/samsung/d1x/AndroidProducts.mk
          echo '    twrp_d1x-eng' >> device/samsung/d1x/AndroidProducts.mk
          
          echo '$(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)' > device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, vendor/twrp/config/common.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo '$(call inherit-product, device/samsung/d1x/device.mk)' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_DEVICE := d1x' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_NAME := twrp_d1x' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_BRAND := samsung' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_MODEL := SM-N971N' >> device/samsung/d1x/twrp_d1x.mk
          echo 'PRODUCT_MANUFACTURER := samsung' >> device/samsung/d1x/twrp_d1x.mk

      - name: Build Recovery
        run: |
          cd ~/fox_12.1
          
          # 1. 严格照抄官方 README 的环境变量
          export FOX_BUILD_DEVICE=d1x
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          source build/envsetup.sh
          
          # 2. 严格照抄官方的 lunch 目标
          lunch twrp_d1x-eng
          
          # 3. 严格照抄官方的编译命令（加入 adbd 支持）
          mka adbd recoveryimage -j$(nproc)

      - name: Package to Odin Tar
        run: |
          cd ~/fox_12.1/out/target/product/d1x
          if [ -f recovery.img ]; then
            echo "编译成功，打包 Odin 格式..."
            tar -cf recovery.tar recovery.img
            md5sum recovery.tar > recovery.tar.md5
          else
            echo "未找到 recovery.img"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.1-d1x-Recovery
          path: |
            ~/fox_12.1/out/target/product/d1x/recovery.img
            ~/fox_12.1/out/target/product/d1x/recovery.tar
            ~/fox_12.1/out/target/product/d1x/recovery.tar.md5
          if-no-files-found: error

      - name: Publish Release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OrangeFox-R12.1-d1x-${{ github.run_id }}
          tag_name: R12.1-${{ github.run_id }}
          files: |
            ~/fox_12.1/out/target/product/d1x/recovery.img
            ~/fox_12.1/out/target/product/d1x/recovery.tar
            ~/fox_12.1/out/target/product/d1x/recovery.tar.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}