# 放到 mcajun87/android_device_samsung_d1x（fox_16.0 分支）的
# .github/workflows/manifest-check.yml
#
# 作用：2 分钟跑完，确认你 fox_16.0 要用的每个仓库和分支都真实存在，
#      顺带校验 local_manifests/d1x.xml 的 XML 语法与 path 冲突。
#      同步前先跑它，比 repo sync 跑 40 分钟才发现 404 划算。

name: OrangeFox repo check

on:
  workflow_dispatch:
  push:
    branches: [fox_16.0]
    paths:
      - 'BoardConfig.mk'
      - 'AndroidProducts.mk'
      - 'twrp.dependencies'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repos and branches
        run: |
          set -u
          fail=0
          chk() {
            owner="$1"; repo="$2"; want="$3"
            url="https://github.com/$owner/$repo.git"
            if git ls-remote --heads "$url" "$want" | grep -q "refs/heads/$want"; then
              echo "OK   $owner/$repo @ $want"
            else
              echo "FAIL $owner/$repo @ $want"
              echo "    现有分支: $(git ls-remote --heads "$url" | awk -F'refs/heads/' '{print $2}' | tr '\n' ' ')"
              fail=1
            fi
          }

          echo "## fox_16.0 必须存在的仓库" >> "$GITHUB_STEP_SUMMARY"

          # 设备树
          chk mcajun87 android_device_samsung_d1x fox_16.0
          chk mcajun87 android_device_samsung_exynos9820-common fox_16.0
          # 备选：自己编小 Image 时用
          chk mcajun87 Rocky7842_android_kernel_samsung_exynos9820 lineage-24.0
          chk mcajun87 Rocky7842_android_kernel_samsung_exynos9820 lineage-24.0-ksu
          # 不适用（只有 fox_12.1），列出来是为了每次提醒别挂错
          echo "--- 以下只有 fox_12.1，fox_16.0 不要挂 ---"
          chk Exynos982x-OrangeFox android_device_samsung_d1x fox_12.1 || true
          chk Exynos982x-OrangeFox android_device_samsung_exynos9820-common fox_12.1 || true

          exit "$fail"

      - name: Verify local manifest xml (if present)
        run: |
          set -eu
          shopt -s nullglob
          files=(local_manifests/*.xml .repo/local_manifests/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 local_manifests，跳过 XML 校验"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "校验 $f"
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          p = sys.argv[1]
          root = ET.parse(p).getroot()
          paths = [pr.get('path') for pr in root.iter('project')]
          dup = [x for x in set(paths) if paths.count(x) > 1]
          print("  project 数:", len(paths))
          if dup:
              print("  ::error::path 重复:", dup)
              sys.exit(1)
          PY
          done

      - name: Note
        run: |
          echo "注意：path 重复检查只覆盖本文件内部；跨清单冲突（例如" \
               "hardware/interfaces 已被主清单占用）需要在 repo init 之后用" \
               " repo manifest 对照。"
