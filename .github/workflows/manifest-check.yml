# 2 分钟静态检查：确认 d1x 专版依赖的仓库/分支真实存在，
# 并核对设备树里几个"改错就进不去系统"的关键配置。
# d1x 专版不涉及任何其他三星型号。

name: d1x tree check

on:
  workflow_dispatch:
  push:
    branches: [fox_16.0]
  pull_request:
    branches: [fox_16.0]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 仓库与分支存在性
        run: |
          set -u
          fail=0
          chk() {
            owner="$1"; repo="$2"; want="$3"
            url="https://github.com/$owner/$repo.git"
            if git ls-remote --heads "$url" "$want" | grep -q "refs/heads/$want"; then
              echo "OK   $owner/$repo@$want"
            else
              echo "FAIL $owner/$repo@$want"
              echo "     现有分支: $(git ls-remote --heads "$url" | awk -F'refs/heads/' '{print $2}' | tr '\n' ' ')"
              fail=1
            fi
          }
          chk mcajun87 android_device_samsung_d1x fox_16.0
          chk mcajun87 android_device_samsung_exynos9820-common fox_16.0
          chk mcajun87 Rocky7842_android_kernel_samsung_exynos9820 lineage-24.0
          exit "$fail"

      - name: 关键配置核对
        run: |
          set -eu
          echo "### d1x 关键配置" >> "$GITHUB_STEP_SUMMARY"

          echo "Image : $(stat -c%s prebuilt/Image) 字节 / sha256 $(sha256sum prebuilt/Image | cut -d' ' -f1)"
          echo "dtbo  : $(stat -c%s prebuilt/dtbo.img) 字节 / sha256 $(sha256sum prebuilt/dtbo.img | cut -d' ' -f1)"

          test -x tools/make_recovery_image.sh || { echo "::error::tools/make_recovery_image.sh 不可执行"; exit 1; }
          bash -n tools/make_recovery_image.sh || { echo "::error::打包脚本语法错误"; exit 1; }

          test -f AndroidProducts.mk
          grep -q 'twrp_d1x-bp2a-eng' AndroidProducts.mk || { echo "::error::AndroidProducts.mk 缺 lunch 目标"; exit 1; }
          echo "全部通过"
